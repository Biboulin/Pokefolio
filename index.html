<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokéFolio">
<meta name="description" content="Suivi de valeur de ma collection de cartes Pokémon.">
<title>PokéFolio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="appbar">
  <div class="brand"><img src="icons/icon-192.png" alt="" class="logo"><div><h1 id="title">Portefeuille</h1><div class="sub" id="subtitle"></div></div></div>
  <button class="iconbtn" id="bSort" aria-label="Trier" hidden>⇅</button>
</header>

<main>
  <!-- PORTEFEUILLE -->
  <section class="view on" id="v-home">
    <div class="hero">
      <div class="lbl">Valeur estimée</div>
      <div class="big num" id="hValue">—</div>
      <div class="delta" id="hDelta"></div>
      <div class="kpis">
        <button class="kpi" id="kInvest"><span>Investi ✎</span><b id="kInv">—</b></button>
        <div class="kpi"><span>Prix des cartes</span><b id="kPaid">—</b></div>
        <div class="kpi"><span>Réalisé (ventes)</span><b id="kReal">—</b></div>
      </div>
      <div class="note" id="gapNote" hidden></div>
    </div>

    <div class="movers" id="movers"></div>

    <div class="panel"><div class="ph"><h3>Payé → valeur actuelle</h3><span class="cap">Touche une ligne pour le détail</span></div>
      <div class="lgd"><span><i class="ring"></i>Payé</span><span><i style="background:var(--up)"></i>Valeur en hausse</span><span><i style="background:var(--down)"></i>Valeur en baisse</span></div>
      <div id="chDumb"></div></div>
    <div class="panel"><div class="ph"><h3>Répartition de la valeur</h3></div>
      <div class="donutwrap"><div id="chDonut"></div><div class="legend" id="lgDonut"></div></div></div>
    <div class="panel"><div class="ph"><h3>Évolution</h3><span class="cap" id="histCap"></span></div>
      <div class="lgd"><span><i style="background:#3987e5"></i>Valeur</span><span><i class="dash"></i>Payé</span></div>
      <div id="chHist"></div></div>
  </section>

  <!-- CARTES -->
  <section class="view" id="v-cards">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Rechercher une carte…" autocomplete="off">
      <div class="seg" id="sort">
        <button data-s="pl" class="on">+/−</button><button data-s="val">Valeur</button><button data-s="pct">%</button><button data-s="name">A–Z</button>
      </div>
    </div>
    <div class="filters" id="filters">
      <button data-f="all" class="on">Toutes</button><button data-f="owned">En stock</button><button data-f="sold">Vendues</button><button data-f="nophoto">Sans photo</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- REGLAGES -->
  <section class="view" id="v-settings"></section>
</main>

<nav class="tabbar">
  <button class="tab on" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9v9z"/><path d="M12 3a9 9 0 0 1 9 9h-9z" opacity=".55"/></svg><span>Portefeuille</span></button>
  <button class="tab" data-v="cards"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="11" rx="2"/><rect x="13" y="3" width="8" height="11" rx="2"/><rect x="3" y="16" width="18" height="5" rx="2" opacity=".55"/></svg><span>Cartes</span></button>
  <button class="tab" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5l2 2.6 3.3-.4.6 3.2 2.9 1.6-1.4 3 1.4 3-2.9 1.6-.6 3.2-3.3-.4-2 2.6-2-2.6-3.3.4-.6-3.2-2.9-1.6 1.4-3-1.4-3 2.9-1.6.6-3.2 3.3.4z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Réglages</span></button>
</nav>
<button class="fab" id="bAdd" aria-label="Ajouter une carte">＋</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="in" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="importPick" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
